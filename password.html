<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问验证 - 私人影院</title>
    <style>
        /* ===== 全局样式重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ===== 主体样式 ===== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            min-width: 320px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 密码容器样式 ===== */
        .password-container {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 40px 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .password-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .password-icon {
            font-size: 3em;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .password-title {
            color: white;
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .password-desc {
            color: rgba(255,255,255,0.8);
            font-size: 1em;
            line-height: 1.5;
        }

        .password-input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .password-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .password-requirements {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.8em;
            color: rgba(255,255,255,0.6);
        }

        .requirement-item {
            transition: all 0.3s ease;
        }

        .requirement-item[data-valid="true"] {
            color: rgba(34, 197, 94, 0.8);
        }

        .password-btn {
            background: rgba(59, 130, 246, 0.8);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }

        .password-btn:hover {
            background: rgba(59, 130, 246, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .password-btn:active {
            transform: translateY(0);
        }

        .btn-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .password-error {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            margin: 20px 0;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-icon {
            font-size: 1em;
        }

        .password-footer {
            text-align: center;
            margin-top: 25px;
        }

        .password-hint {
            color: rgba(255,255,255,0.6);
            font-size: 0.85em;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .agreement-text {
            color: rgba(255,255,255,0.7);
            font-size: 0.8em;
            text-align: center;
        }

        /* 使用条款样式 */
        .terms-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 25px;
            max-width: 500px;
            width: 90%;
            margin-top: 20px;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .terms-container:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .terms-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .terms-icon {
            font-size: 1.2em;
        }

        .terms-title {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .terms-content {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            line-height: 1.6;
        }

        .terms-section {
            margin-bottom: 15px;
        }

        .terms-section-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: white;
            font-size: 14px;
        }

        .terms-list {
            margin: 8px 0 8px 20px;
            font-size: 11px;
        }

        .terms-list li {
            margin-bottom: 5px;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            .password-container {
                padding: 30px 20px;
            }
            .password-icon {
                font-size: 2.5em;
            }
            .password-title {
                font-size: 1.5em;
            }
            .password-input {
                padding: 12px 16px;
                font-size: 16px;
            }
            .password-requirements {
                flex-direction: column;
                gap: 8px;
            }
            .terms-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- 密码验证区域 -->
        <div class="password-container">
            <div class="password-header">
                <div class="password-icon">🔒</div>
                <div class="password-title">访问验证</div>
                <div class="password-desc">请输入访问密码继续浏览内容</div>
            </div>
            
            <div class="password-input-group">
                <input type="password" id="passwordInput" class="password-input" 
                       placeholder="请输入4位数字密码" maxlength="4" inputmode="numeric">
                <div class="password-requirements">
                    <span class="requirement-item" data-valid="false">● 4位数字</span>
                    <span class="requirement-item" data-valid="false">● 纯数字组合</span>
                </div>
            </div>
            
            <button id="passwordSubmit" class="password-btn">
                <span class="btn-text">进入网站</span>
                <span class="btn-loading" style="display: none;">验证中...</span>
            </button>
            
            <div id="passwordError" class="password-error">
                <span class="error-icon">❌</span>
                <span class="error-text">密码错误，请重新输入</span>
            </div>
            
            <div class="password-footer">
                <div class="password-hint">密码定期更换，请勿外传</div>
                <div class="agreement-text">登录即表示您已阅读、理解并同意下方使用条款</div>
            </div>
        </div>

        <!-- 使用条款区域 -->
        <div class="terms-container">
            <div class="terms-header">
                <span class="terms-icon">📋</span>
                <span class="terms-title">使用条款</span>
            </div>
            <div class="terms-content">
                <div class="terms-section">
                    <div class="terms-section-title">⚖️ 使用条款</div>
                    <p>请用户严格遵守以下条款：</p>
                    <ul class="terms-list">
                        <li>仅限个人学习、研究使用，禁止商业用途</li>
                        <li>请在下载后24小时内删除相关内容</li>
                        <li>不得用于非法用途，否则后果自负</li>
                        <li>若涉及版权问题，请联系：xiaopgys@163.com 及时处理</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 密码配置 =====
        const PASSWORD_KEY = "site_access_token";
        let CURRENT_PASSWORD = "2025";

        // ===== 从配置文件加载密码 =====
        async function loadPasswordConfig() {
            try {
                const response = await fetch('./password-worker.js');
                const configText = await response.text();
                
                const passwordMatch = configText.match(/currentPassword:\s*"(\d+)"/);
                if (passwordMatch && passwordMatch[1]) {
                    CURRENT_PASSWORD = passwordMatch[1];
                }
            } catch (error) {
                console.log('使用默认密码');
            }
        }

        // ===== 密码验证功能 =====
        function checkPassword() {
            const passwordInput = document.getElementById('passwordInput');
            const errorElement = document.getElementById('passwordError');
            const submitButton = document.getElementById('passwordSubmit');
            const inputPassword = passwordInput.value.trim();

            // 显示加载状态
            submitButton.querySelector('.btn-text').style.display = 'none';
            submitButton.querySelector('.btn-loading').style.display = 'block';
            submitButton.disabled = true;

            setTimeout(() => {
                if (inputPassword === CURRENT_PASSWORD) {
                    // 密码正确
                    const expiryDate = new Date();
                    expiryDate.setDate(expiryDate.getDate() + 7);
                    localStorage.setItem(PASSWORD_KEY, JSON.stringify({
                        token: btoa(CURRENT_PASSWORD + '_' + expiryDate.getTime()),
                        expiry: expiryDate.getTime()
                    }));
                    
                    // 成功样式
                    passwordInput.style.borderColor = 'rgba(34, 197, 94, 0.8)';
                    passwordInput.style.background = 'rgba(34, 197, 94, 0.1)';
                    
                    setTimeout(() => {
                        // 跳转到主页面
                        window.location.href = 'index.html';
                    }, 500);
                    
                } else {
                    // 密码错误
                    errorElement.style.display = 'flex';
                    passwordInput.style.borderColor = 'rgba(239, 68, 68, 0.8)';
                    passwordInput.style.background = 'rgba(239, 68, 68, 0.1)';
                    passwordInput.value = '';
                    passwordInput.focus();
                    
                    // 恢复按钮状态
                    submitButton.querySelector('.btn-text').style.display = 'block';
                    submitButton.querySelector('.btn-loading').style.display = 'none';
                    submitButton.disabled = false;
                }
            }, 800);
        }

        // ===== 实时密码验证 =====
        function validatePasswordInput() {
            const passwordInput = document.getElementById('passwordInput');
            const requirements = document.querySelectorAll('.requirement-item');
            const inputValue = passwordInput.value;
            
            const isValidLength = inputValue.length === 4;
            const isNumericOnly = /^\d+$/.test(inputValue);
            
            requirements[0].setAttribute('data-valid', isValidLength.toString());
            requirements[1].setAttribute('data-valid', isNumericOnly.toString());
            
            if (inputValue.length > 0) {
                if (isValidLength && isNumericOnly) {
                    passwordInput.style.borderColor = 'rgba(34, 197, 94, 0.6)';
                } else {
                    passwordInput.style.borderColor = 'rgba(234, 179, 8, 0.6)';
                }
            } else {
                passwordInput.style.borderColor = 'rgba(255,255,255,0.3)';
            }
        }

        // ===== 检查是否已认证 =====
        function checkExistingAuth() {
            const savedAuth = localStorage.getItem(PASSWORD_KEY);
            if (savedAuth) {
                try {
                    const authData = JSON.parse(savedAuth);
                    if (authData.expiry > Date.now()) {
                        // 已认证，跳转到主页面
                        window.location.href = 'index.html';
                        return true;
                    } else {
                        localStorage.removeItem(PASSWORD_KEY);
                    }
                } catch (e) {
                    localStorage.removeItem(PASSWORD_KEY);
                }
            }
            return false;
        }

        // ===== 初始化 =====
        async function init() {
            // 先检查是否已认证
            if (!checkExistingAuth()) {
                // 加载密码配置
                await loadPasswordConfig();
                
                // 设置事件监听
                const passwordInput = document.getElementById('passwordInput');
                const submitButton = document.getElementById('passwordSubmit');
                
                passwordInput.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    validatePasswordInput();
                });
                
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') checkPassword();
                });
                
                submitButton.addEventListener('click', checkPassword);
                
                // 自动聚焦
                passwordInput.focus();
            }
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
